name: build-images
on:
  workflow_dispatch:
  push:
    paths: ["products.json", "compose.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow requests
      - run: python compose.py
      - run: |
          git config user.name "fresmio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add images
          git commit -m "Generated pack images" || echo "nothing to commit"
          git push
